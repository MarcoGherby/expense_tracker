<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f766e">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Expense Tracker</title>
<style>
:root {
  --bg: #f1f4f2; --card: #ffffff; --text: #1d2b2a; --muted: #62736f;
  --primary: #0f766e; --income: #15803d; --expense: #b4442c; --border: #dbe3df;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #101816; --card: #19241f; --text: #e8f0ec; --muted: #93a8a1;
    --primary: #2dd4bf; --income: #4ade80; --expense: #f08a74; --border: #2b3a35;
  }
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
}
main { max-width: 720px; margin: 0 auto; padding: 16px; display: grid; gap: 14px; }
h1 { font-size: 1.4rem; margin: 0; }
h2 { font-size: 1.05rem; margin: 0 0 10px; }
.card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px; }
.top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.grid3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; text-align: center; }
.grid3 small { color: var(--muted); display: block; }
.grid3 strong { font-size: 1.05rem; }
.income { color: var(--income); } .expense { color: var(--expense); }
label { display: grid; gap: 4px; font-size: .85rem; color: var(--muted); }
input, select, button {
  font: inherit; padding: 10px; border-radius: 8px; border: 1px solid var(--border);
  background: var(--bg); color: var(--text); min-height: 44px; width: 100%;
}
button { cursor: pointer; background: var(--primary); color: #fff; border: 0; font-weight: 600; }
button.secondary { background: transparent; color: var(--text); border: 1px solid var(--border); }
button.small { width: auto; min-height: 36px; padding: 6px 12px; font-size: .85rem; }
:focus-visible { outline: 3px solid var(--primary); outline-offset: 2px; }
form { display: grid; gap: 10px; }
.row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.bar { height: 8px; background: var(--border); border-radius: 4px; overflow: hidden; margin-top: 6px; }
.bar > span { display: block; height: 100%; background: var(--primary); }
.bar.over > span { background: var(--expense); }
.cat { margin-bottom: 10px; }
.cat div { display: flex; justify-content: space-between; }
ul { list-style: none; margin: 0; padding: 0; }
li.tx { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; padding: 10px 0; border-top: 1px solid var(--border); }
li.tx:first-child { border-top: 0; }
li.tx .meta { color: var(--muted); font-size: .82rem; }
li.tx .actions { grid-column: 1 / -1; display: flex; gap: 8px; }
.empty { color: var(--muted); margin: 0; }
.toast {
  position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%);
  background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 8px;
  display: none; max-width: 90%;
}
.toast.show { display: block; }
</style>
</head>
<body>
<main>
  <div class="top">
    <h1>Expense Tracker</h1>
    <label style="width:170px">Mese
      <input type="month" id="monthInput">
    </label>
  </div>

  <section class="card">
    <div class="grid3">
      <div><small>Entrate</small><strong class="income" id="sumIncome"></strong></div>
      <div><small>Uscite</small><strong class="expense" id="sumExpenses"></strong></div>
      <div><small>Saldo</small><strong id="sumBalance"></strong></div>
    </div>
  </section>

  <section class="card">
    <h2>Budget mensile</h2>
    <div class="top"><span id="budgetText"></span><span id="remainingText"></span></div>
    <div class="bar" id="budgetBar"><span></span></div>
    <form id="budgetForm" style="margin-top:12px">
      <div class="row2">
        <input type="text" inputmode="decimal" id="budgetInput" aria-label="Budget mensile">
        <button type="submit">Aggiorna budget</button>
      </div>
    </form>
  </section>

  <section class="card">
    <h2 id="formTitle">Nuova transazione</h2>
    <form id="txForm">
      <div class="row2">
        <label>Tipo
          <select id="kindInput">
            <option value="Uscita">Uscita</option>
            <option value="Entrata">Entrata</option>
          </select>
        </label>
        <label>Categoria
          <select id="categoryInput"></select>
        </label>
      </div>
      <label>Descrizione
        <input type="text" id="descriptionInput" required maxlength="100">
      </label>
      <div class="row2">
        <label>Importo
          <input type="text" inputmode="decimal" id="amountInput" required placeholder="0,00">
        </label>
        <label>Data
          <input type="date" id="dateInput" required>
        </label>
      </div>
      <button type="submit" id="submitBtn">Aggiungi transazione</button>
      <button type="button" class="secondary" id="cancelEditBtn" hidden>Annulla modifica</button>
    </form>
  </section>

  <section class="card">
    <h2>Uscite per categoria</h2>
    <div id="categoryList"></div>
  </section>

  <section class="card">
    <h2>Transazioni del mese</h2>
    <ul id="txList"></ul>
  </section>

  <section class="card">
    <h2>Backup</h2>
    <p class="empty" style="margin-bottom:10px">I dati sono salvati solo su questo telefono. Esporta un backup ogni tanto.</p>
    <div class="row2">
      <button class="secondary" id="exportBtn" type="button">Esporta backup</button>
      <button class="secondary" id="importBtn" type="button">Importa backup</button>
    </div>
    <input type="file" id="importFile" accept="application/json,.json" hidden>
  </section>
</main>
<div class="toast" id="toast" role="status"></div>

<script>
"use strict";

const KEY_TRANSACTIONS = "expense_tracker_transactions";
const KEY_BUDGET = "expense_tracker_budget";

// Values stay in Italian so old data (kind = Entrata/Uscita) imports unchanged.
const CATEGORIES = {
  "Entrata": ["Stipendio", "Lavoro extra", "Regali", "Rimborsi", "Altro"],
  "Uscita": ["Casa", "Alimentari", "Trasporti", "Ristoranti", "Svago",
             "Salute", "Abbigliamento", "Abbonamenti", "Viaggi", "Altro"],
};

const $ = (id) => document.getElementById(id);
const money = new Intl.NumberFormat("it-IT", { style: "currency", currency: "EUR" });

function readStorage(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch (err) {
    return fallback;
  }
}

function writeStorage(key, value) {
  try {
    localStorage.setItem(key, JSON.stringify(value));
  } catch (err) {
    showToast("Impossibile salvare i dati su questo dispositivo.");
  }
}

function todayISO() {
  const now = new Date();
  return new Date(now - now.getTimezoneOffset() * 60000).toISOString().slice(0, 10);
}

function newId() {
  return Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
}

function escapeHtml(text) {
  return String(text).replace(/[&<>"']/g, (c) =>
    ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

function parseAmount(raw) {
  const value = Number(String(raw).trim().replace(",", "."));
  return Number.isFinite(value) && value > 0 ? value : null;
}

function isValidDate(text) {
  return /^\d{4}-\d{2}-\d{2}$/.test(text) && !Number.isNaN(Date.parse(text));
}

let transactions = readStorage(KEY_TRANSACTIONS, []);
let budget = Number(readStorage(KEY_BUDGET, 1000));
let currentMonth = todayISO().slice(0, 7);
let editingId = null;
let toastTimer = null;

function showToast(message) {
  const toast = $("toast");
  toast.textContent = message;
  toast.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove("show"), 2500);
}

function saveTransactions() {
  writeStorage(KEY_TRANSACTIONS, transactions);
}

function fillCategories(kind, selected) {
  const select = $("categoryInput");
  select.innerHTML = CATEGORIES[kind]
    .map((name) => `<option value="${name}">${name}</option>`).join("");
  if (selected && CATEGORIES[kind].includes(selected)) select.value = selected;
}

function monthTransactions() {
  return transactions
    .filter((t) => t.transaction_date.slice(0, 7) === currentMonth)
    .sort((a, b) => b.transaction_date.localeCompare(a.transaction_date));
}

function render() {
  const items = monthTransactions();
  const income = items.filter((t) => t.kind === "Entrata").reduce((s, t) => s + t.amount, 0);
  const expenses = items.filter((t) => t.kind === "Uscita").reduce((s, t) => s + t.amount, 0);
  const balance = income - expenses;
  const remaining = budget - expenses;

  $("monthInput").value = currentMonth;
  $("sumIncome").textContent = money.format(income);
  $("sumExpenses").textContent = money.format(expenses);
  $("sumBalance").textContent = money.format(balance);
  $("sumBalance").className = balance >= 0 ? "income" : "expense";

  $("budgetText").textContent = `Budget: ${money.format(budget)}`;
  $("remainingText").textContent = remaining >= 0
    ? `Restano ${money.format(remaining)}`
    : `Sforato di ${money.format(-remaining)}`;
  $("remainingText").className = remaining >= 0 ? "income" : "expense";
  const percent = budget > 0 ? Math.min(100, (expenses / budget) * 100) : (expenses > 0 ? 100 : 0);
  $("budgetBar").className = "bar" + (remaining < 0 ? " over" : "");
  $("budgetBar").firstElementChild.style.width = percent + "%";
  if (document.activeElement !== $("budgetInput")) {
    $("budgetInput").value = String(budget).replace(".", ",");
  }

  // Expenses grouped by category, largest first
  const totals = {};
  items.filter((t) => t.kind === "Uscita").forEach((t) => {
    totals[t.category] = (totals[t.category] || 0) + t.amount;
  });
  const rows = Object.entries(totals).sort((a, b) => b[1] - a[1]);
  $("categoryList").innerHTML = rows.length
    ? rows.map(([name, total]) => `
        <div class="cat">
          <div><span>${escapeHtml(name)}</span><strong>${money.format(total)}</strong></div>
          <div class="bar"><span style="width:${(total / expenses) * 100}%"></span></div>
        </div>`).join("")
    : '<p class="empty">Nessuna uscita in questo mese.</p>';

  $("txList").innerHTML = items.length
    ? items.map((t) => `
        <li class="tx">
          <div>
            <div>${escapeHtml(t.description)}</div>
            <div class="meta">${t.transaction_date} · ${escapeHtml(t.category)}</div>
          </div>
          <strong class="${t.kind === "Entrata" ? "income" : "expense"}">
            ${t.kind === "Entrata" ? "+" : "−"}${money.format(t.amount)}
          </strong>
          <div class="actions">
            <button class="secondary small" data-edit="${t.id}">Modifica</button>
            <button class="secondary small" data-delete="${t.id}">Elimina</button>
          </div>
        </li>`).join("")
    : '<p class="empty">Nessuna transazione. Aggiungine una con il modulo qui sopra.</p>';
}

function resetForm() {
  editingId = null;
  $("txForm").reset();
  $("kindInput").value = "Uscita";
  fillCategories("Uscita");
  $("dateInput").value = todayISO();
  $("formTitle").textContent = "Nuova transazione";
  $("submitBtn").textContent = "Aggiungi transazione";
  $("cancelEditBtn").hidden = true;
}

$("kindInput").addEventListener("change", (e) => fillCategories(e.target.value));

$("monthInput").addEventListener("change", (e) => {
  if (e.target.value) {
    currentMonth = e.target.value;
    render();
  }
});

$("txForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const kind = $("kindInput").value;
  const category = $("categoryInput").value;
  const description = $("descriptionInput").value.trim();
  const amount = parseAmount($("amountInput").value);
  const date = $("dateInput").value;

  if (!description || !CATEGORIES[kind].includes(category)) {
    showToast("Controlla tipo, descrizione e categoria.");
    return;
  }
  if (amount === null || !isValidDate(date)) {
    showToast("Inserisci un importo positivo e una data valida.");
    return;
  }

  const record = { kind, description, category, amount, transaction_date: date };
  if (editingId) {
    transactions = transactions.map((t) => (t.id === editingId ? { ...t, ...record } : t));
    showToast("Transazione aggiornata.");
  } else {
    transactions.push({ id: newId(), ...record });
    showToast("Transazione aggiunta.");
  }
  saveTransactions();
  currentMonth = date.slice(0, 7);
  resetForm();
  render();
});

$("cancelEditBtn").addEventListener("click", resetForm);

$("txList").addEventListener("click", (e) => {
  const editId = e.target.dataset.edit;
  const deleteId = e.target.dataset.delete;
  if (editId) {
    const t = transactions.find((x) => x.id === editId);
    if (!t) return;
    editingId = t.id;
    $("kindInput").value = t.kind;
    fillCategories(t.kind, t.category);
    $("descriptionInput").value = t.description;
    $("amountInput").value = String(t.amount).replace(".", ",");
    $("dateInput").value = t.transaction_date;
    $("formTitle").textContent = "Modifica transazione";
    $("submitBtn").textContent = "Salva modifiche";
    $("cancelEditBtn").hidden = false;
    $("txForm").scrollIntoView({ behavior: "smooth", block: "center" });
  } else if (deleteId) {
    if (!confirm("Eliminare questa transazione?")) return;
    transactions = transactions.filter((t) => t.id !== deleteId);
    saveTransactions();
    if (editingId === deleteId) resetForm();
    render();
    showToast("Transazione eliminata.");
  }
});

$("budgetForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const value = Number($("budgetInput").value.trim().replace(",", "."));
  if (!Number.isFinite(value) || value < 0) {
    showToast("Inserisci un budget valido.");
    return;
  }
  budget = value;
  writeStorage(KEY_BUDGET, budget);
  $("budgetInput").blur();
  render();
  showToast("Budget mensile aggiornato.");
});

// ---- Backup: export / import JSON ----
$("exportBtn").addEventListener("click", () => {
  const payload = JSON.stringify({ budget, transactions }, null, 2);
  const url = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
  const link = document.createElement("a");
  link.href = url;
  link.download = `expense-tracker-backup-${todayISO()}.json`;
  document.body.appendChild(link);
  link.click();
  link.remove();
  URL.revokeObjectURL(url);
});

$("importBtn").addEventListener("click", () => $("importFile").click());

$("importFile").addEventListener("change", async (e) => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try {
    const data = JSON.parse(await file.text());
    const list = Array.isArray(data) ? data : data.transactions;
    if (!Array.isArray(list)) throw new Error("bad format");

    const valid = list.map((t) => ({
      id: newId(),
      kind: t.kind,
      description: String(t.description || "").trim(),
      category: t.category,
      amount: Number(t.amount),
      transaction_date: String(t.transaction_date || ""),
    })).filter((t) =>
      CATEGORIES[t.kind] && t.description && t.category &&
      t.amount > 0 && isValidDate(t.transaction_date));

    const replace = confirm(
      `Trovate ${valid.length} transazioni valide.\n\nOK = sostituisci i dati attuali\nAnnulla = aggiungi a quelli esistenti`);
    transactions = replace ? valid : transactions.concat(valid);
    if (!Array.isArray(data) && Number.isFinite(Number(data.budget)) && replace) {
      budget = Number(data.budget);
      writeStorage(KEY_BUDGET, budget);
    }
    saveTransactions();
    render();
    showToast("Backup importato.");
  } catch (err) {
    showToast("File non valido: scegli un backup in formato JSON.");
  }
});

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}

fillCategories("Uscita");
$("dateInput").value = todayISO();
render();
</script>
</body>
</html>
